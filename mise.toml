[tools]
dart = "3.12.2"

[tasks.get]
description = "Install Dart dependencies"
run = "dart pub get"

[tasks.serve]
description = "Run the Jaspr development server"
run = "dart run jaspr_cli:jaspr serve"

[tasks.build]
description = "Build the static site"
run = "dart run jaspr_cli:jaspr build"

[tasks.check]
description = "Analyze and build the project"
run = ["dart analyze", "dart run jaspr_cli:jaspr build"]

[tasks.agent-check]
description = "Validate AI agent SSoT and compatibility links"
run = "bash tool/check-agent-ssot.sh"
